name: Release

# Baut bei einem Tag vX.Y.Z den Web-Build sowie macOS- und Windows-Desktop-
# Artefakte (inkl. Windows-Portable-.exe) und hängt sie ans GitHub-Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Version aus Tag übernehmen
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Web-Build als ZIP packen
        shell: bash
        run: |
          cd dist
          zip -r "../Schreibzeit-Web-${GITHUB_REF_NAME}.zip" .
      - name: Web-Build als Artefakt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schreibzeit-web
          path: dist
      - name: Web-ZIP ans Release anhängen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Schreibzeit-Web-*.zip

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: npm run build:mac
            artifacts: 'release/*.dmg'
          - os: windows-latest
            build: npm run build:win
            artifacts: |
              release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Version aus Tag übernehmen
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - name: Desktop-App bauen
        run: ${{ matrix.build }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Desktop-Artefakte ans Release anhängen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ matrix.artifacts }}
